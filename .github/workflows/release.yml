name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run tests
        run: deno task test

      - name: Run linter
        run: deno task lint

      - name: Run type check
        run: deno task check

  build:
    name: Build Binaries
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linear-for-ai-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: linear-for-ai-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: linear-for-ai-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: linear-for-ai-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Compile binary
        run: |
          deno compile \
            --allow-net \
            --allow-env \
            --allow-read \
            --target ${{ matrix.target }} \
            --output dist/${{ matrix.artifact_name }} \
            src/cli.ts

      - name: Generate checksum
        run: |
          cd dist
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec mv {} release-assets/ \;

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## Installation

            ### Homebrew
            ```bash
            brew tap ramynasr/tap
            brew install linear-for-ai
            ```

            ### Manual Installation

            Download the appropriate binary for your platform:
            - **macOS Intel**: `linear-for-ai-macos-x64`
            - **macOS Apple Silicon**: `linear-for-ai-macos-arm64`
            - **Linux x64**: `linear-for-ai-linux-x64`
            - **Linux ARM64**: `linear-for-ai-linux-arm64`

            Make it executable and move to your PATH:
            ```bash
            chmod +x linear-for-ai-*
            sudo mv linear-for-ai-* /usr/local/bin/linear-for-ai
            ```

            ### Verify Installation
            ```bash
            linear-for-ai --version
            ```

            ## What's Changed
            See [CHANGELOG.md](CHANGELOG.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Clone Homebrew tap repository
        run: |
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/ramynasr/homebrew-tap.git homebrew-tap

      - name: Update formula
        run: |
          bash scripts/update-homebrew-formula.sh ${{ steps.version.outputs.version }} homebrew-tap

      - name: Commit and push changes
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/linear-for-ai.rb
          git commit -m "Update linear-for-ai to v${{ steps.version.outputs.version }}"
          git push
